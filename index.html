<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciber Planet | Centro de Gaming & Internet</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="icono.png">
    <style>
        :root {
            --cyan: #00f5ff;
            --magenta: #ff00ff;
            --purple: #bf00ff;
            --green: #39ff14;
            --dark: #0a0a0f;
            --darker: #050508;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Scanlines */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
            z-index: 9999;
        }

        /* Fondo radial */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background:
                radial-gradient(ellipse at 15% 85%, rgba(191,0,255,0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 15%, rgba(0,245,255,0.15) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(0,20,40,0.8) 0%, var(--dark) 70%);
        }

        /* Grid perspectiva */
        .grid-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image:
                linear-gradient(rgba(0,245,255,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,245,255,0.045) 1px, transparent 1px);
            background-size: 55px 55px;
            transform: perspective(600px) rotateX(55deg);
            transform-origin: top;
            animation: gridMove 25s linear infinite;
        }

        @keyframes gridMove {
            0%   { background-position: 0 0; }
            100% { background-position: 0 55px; }
        }

        /* Stars */
        .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
        .star {
            position: absolute;
            width: 2px; height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50%       { opacity: 1; }
        }

        /* ── NAV ─────────────────────────────────── */
        nav {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(16px);
            background: rgba(5,5,8,0.92);
            border-bottom: 1px solid rgba(0,245,255,0.15);
            overflow: visible;
        }
        .nav-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.3rem 2.5rem;
            gap: 1rem;
            height: 62px;
        }
        .nav-logo { position: relative; }
        .nav-logo a { display: flex; align-items: center; }
        .nav-logo img {
            height: 110px;
            position: relative;
            top: 12px;
            filter: drop-shadow(0 0 8px var(--cyan));
            transition: filter 0.3s, transform 0.3s;
        }
        .nav-logo img:hover {
            filter: drop-shadow(0 0 18px var(--cyan)) drop-shadow(0 0 35px var(--magenta));
            transform: scale(1.06);
        }
        .nav-links { display: flex; gap: 0.3rem; list-style: none; align-items: center; }
        .nav-links a {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.72rem; font-weight: 600;
            color: #fff; text-decoration: none;
            padding: 0.45rem 0.85rem;
            position: relative; transition: color 0.3s;
            letter-spacing: 0.04em; white-space: nowrap;
        }
        .nav-links a::after {
            content: ''; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--magenta));
            transform: scaleX(0); transition: transform 0.3s;
        }
        .nav-links a:hover { color: var(--cyan); }
        .nav-links a:hover::after, .nav-links a.active::after { transform: scaleX(1); }
        .nav-links a.active { color: var(--cyan); }
        .nav-toggle {
            display: none; flex-direction: column; gap: 5px;
            cursor: pointer; padding: 6px;
            background: none; border: none; z-index: 10;
        }
        .nav-toggle span {
            display: block; width: 26px; height: 2px;
            background: var(--cyan); border-radius: 2px;
            transition: all 0.3s; box-shadow: 0 0 6px var(--cyan);
        }
        .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .nav-toggle.open span:nth-child(2) { opacity: 0; }
        .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .nav-dropdown {
            display: none; flex-direction: column;
            background: rgba(5,5,8,0.98);
            border-top: 1px solid rgba(0,245,255,0.1);
            padding: 0.5rem 0 0.8rem;
        }
        .nav-dropdown.open { display: flex; }
        .nav-dropdown li { list-style: none; }
        .nav-dropdown a {
            font-family: 'Orbitron', sans-serif; font-size: 0.72rem; font-weight: 600;
            color: #fff; text-decoration: none; padding: 0.75rem 2rem;
            display: block; letter-spacing: 0.05em;
            border-left: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }
        .nav-dropdown a:hover, .nav-dropdown a.active {
            color: var(--cyan); border-left-color: var(--cyan);
            background: rgba(0,245,255,0.05);
        }
        @media (max-width: 768px) {
            .nav-inner { padding: 0.3rem 1.2rem; height: 54px; }
            .nav-logo img { height: 80px; top: 10px; }
            .nav-links { display: none; }
            .nav-toggle { display: flex; }
        }

        /* ── HERO ────────────────────────────────── */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 2rem 4rem;
            position: relative;
        }

        .hero-logo {
            width: min(520px, 82vw);
            margin-bottom: 2rem;
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 0 30px rgba(0,245,255,0.4)) drop-shadow(0 0 60px rgba(191,0,255,0.2));
            transition: filter 0.3s;
        }
        .hero-logo:hover {
            filter: drop-shadow(0 0 50px rgba(0,245,255,0.7)) drop-shadow(0 0 90px rgba(255,0,255,0.4));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-18px); }
        }

        .hero-tagline {
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.5rem, 1.8vw, 0.85rem);
            color: var(--green);
            text-shadow: 0 0 12px var(--green), 0 0 25px rgba(57,255,20,0.4);
            margin-bottom: 3rem;
            letter-spacing: 0.08em;
            animation: taglinePulse 3s ease-in-out infinite;
        }
        @keyframes taglinePulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.75; }
        }

        .hero-btns {
            display: flex;
            gap: 1.4rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* Botones */
        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 0.9rem 2.4rem;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            transition: all 0.3s;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            color: var(--dark);
        }
        .btn-primary:hover {
            box-shadow: 0 0 25px var(--cyan), 0 0 50px rgba(191,0,255,0.5);
            transform: translateY(-3px) scale(1.02);
        }

        .btn-secondary {
            background: transparent;
            color: var(--cyan);
            border: 1.5px solid var(--cyan);
        }
        .btn-secondary:hover {
            background: rgba(0,245,255,0.08);
            box-shadow: 0 0 22px rgba(0,245,255,0.35);
            transform: translateY(-3px) scale(1.02);
        }

        /* Astronaut cat */
        .astronaut-wrap {
            position: fixed;
            bottom: 0px;
            left: 30px;
            width: 260px;
            z-index: 100;
            pointer-events: none;
            animation: astroFloat 4s ease-in-out infinite;
        }
        .astronaut {
            width: 100%;
            display: block;
            filter: drop-shadow(0 0 18px rgba(191,0,255,0.7)) drop-shadow(0 0 35px rgba(0,245,255,0.35));
        }
        @keyframes astroFloat {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50%       { transform: translateY(-20px) rotate(2deg); }
        }

        /* Fire particles */
        .fire-container {
            position: absolute;
            /* Rocket exhaust is at bottom-left of the image */
            bottom: 22%;
            left: 2%;
            width: 50px;
            height: 0;
            pointer-events: none;
            transform: rotate(45deg); /* align with rocket angle */
        }
        .fire-particle {
            position: absolute;
            bottom: 0;
            border-radius: 50% 30% 50% 30%;
            opacity: 0;
            animation: fireShoot linear infinite;
        }
        @keyframes fireShoot {
            0%   { transform: translate(0, 0) scale(1);   opacity: 1; }
            50%  { opacity: 0.7; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }

        /* Floating pixels */
        .pixel-container { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .px {
            position: absolute;
            width: 6px; height: 6px;
            border-radius: 1px;
            opacity: 0;
            animation: floatPx linear infinite;
        }
        @keyframes floatPx {
            0%   { transform: translateY(110vh) rotate(0deg);   opacity: 0; }
            8%   { opacity: 0.7; }
            92%  { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--darker); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--cyan), var(--magenta));
            border-radius: 4px;
        }
        ::selection { background: var(--magenta); color: var(--dark); }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-btns { flex-direction: column; align-items: center; }
            .btn { width: 260px; text-align: center; }
            .astronaut-wrap { width: 110px; left: 8px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div class="grid-bg"></div>
    <div class="stars" id="stars"></div>
    <div class="pixel-container" id="pixels"></div>

    <!-- Astronaut cat with fire -->
    <div class="astronaut-wrap">
        <div class="fire-container" id="fireContainer"></div>
        <img src="robin-astronauta.png" alt="Robin astronauta" class="astronaut">
    </div>

    <!-- NAV -->

    <nav>
        <div class="nav-inner">
            <div class="nav-logo">
                <a href="index.html"><img src="firma-ciber.png" alt="Ciber Planet Logo"></a>
            </div>
            <ul class="nav-links">
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="trabajos.html">Trabajos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="contacto.html#ubicacion">Ubicación</a></li>
            </ul>
            <button class="nav-toggle" id="navToggle" aria-label="Menú">
                <span></span><span></span><span></span>
            </button>
        </div>
        <ul class="nav-dropdown" id="navDropdown">
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="trabajos.html">Trabajos</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            <li><a href="contacto.html#ubicacion">Ubicación</a></li>
        </ul>
    </nav>

    <!-- HERO -->
    <div class="hero">
        <img src="firma-ciber.png" alt="Ciber Planet" class="hero-logo">
        <p class="hero-tagline">>> TU PORTAL AL MUNDO DIGITAL <<</p>
        <div class="hero-btns">
            <a href="servicios.html" class="btn btn-primary">Ver Servicios</a>
            <a href="contacto.html" class="btn btn-secondary">Contáctanos</a>
        </div>
    </div>

    <script>
        // Stars
        const sc = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top  = Math.random() * 100 + '%';
            s.style.animationDelay    = Math.random() * 3 + 's';
            s.style.animationDuration = (Math.random() * 2 + 2) + 's';
            sc.appendChild(s);
        }

        // Fire particles — shoot toward bottom-left (rocket exhaust direction)
        const fc = document.getElementById('fireContainer');
        const fireColors = [
            '#fff7a0','#ffee44','#ffaa00','#ff6600','#ff3300',
            '#cc00ff','#8800cc','#ffffff'
        ];
        function spawnFire() {
            const f = document.createElement('div');
            f.className = 'fire-particle';
            const size = Math.random() * 16 + 8;
            // Direction: down-left (negative X, positive Y in screen coords)
            const dx = -(Math.random() * 60 + 30);  // go left
            const dy =  (Math.random() * 60 + 30);  // go down
            const dur = Math.random() * 0.45 + 0.3;
            f.style.width  = size + 'px';
            f.style.height = size + 'px';
            f.style.left   = (Math.random() * 20) + 'px';
            f.style.bottom = (Math.random() * 10) + 'px';
            f.style.background = fireColors[Math.floor(Math.random() * fireColors.length)];
            f.style.boxShadow  = `0 0 ${size * 1.2}px ${f.style.background}`;
            f.style.setProperty('--dx', dx + 'px');
            f.style.setProperty('--dy', dy + 'px');
            f.style.animationDuration = dur + 's';
            fc.appendChild(f);
            setTimeout(() => f.remove(), dur * 1000);
        }
        setInterval(spawnFire, 35);
        const pc = document.getElementById('pixels');
        const colors = ['#00f5ff','#ff00ff','#bf00ff','#39ff14','#ff6ec7','#ffffff'];
        for (let i = 0; i < 55; i++) {
            const p = document.createElement('div');
            p.className = 'px';
            p.style.left            = Math.random() * 100 + '%';
            p.style.bottom          = '-10px';
            p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            p.style.width           = (Math.random() * 5 + 3) + 'px';
            p.style.height          = p.style.width;
            p.style.animationDelay    = Math.random() * 18 + 's';
            p.style.animationDuration = (Math.random() * 12 + 10) + 's';
            pc.appendChild(p);
        }
        // Nav hamburger
        (function(){
            var t = document.getElementById('navToggle');
            var d = document.getElementById('navDropdown');
            if(!t||!d) return;
            t.addEventListener('click', function(){
                t.classList.toggle('open');
                d.classList.toggle('open');
            });
            d.querySelectorAll('a').forEach(function(a){
                a.addEventListener('click', function(){
                    t.classList.remove('open');
                    d.classList.remove('open');
                });
            });
        })();
    </script>
</body>
</html>
